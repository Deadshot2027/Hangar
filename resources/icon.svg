<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Hangar's app icon: the hangar and the bead parked in it on a dark glass tile (macOS icon grid: an 824pt tile). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2e38"/>
      <stop offset="0.55" stop-color="#16181e"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9ccd6"/>
    </linearGradient>
    <radialGradient id="bead" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e6e8ee"/>
      <stop offset="1" stop-color="#a9adba"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-2" y="-2" width="28" height="28">
      <feDropShadow dx="0" dy="0.18" stdDeviation="0.3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>
  <g transform="translate(100 100) scale(34.333)">
    <ellipse cx="12" cy="17.3" rx="5" ry="1.4" fill="url(#glow)"/>
    <path d="M4.4 18.4H19.6M6.2 18.4V12.2a5.8 5.8 0 0 1 11.6 0v6.2" fill="none" stroke="url(#arch)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
    <circle cx="12" cy="15.6" r="2.3" fill="url(#bead)" filter="url(#soft)"/>
  </g>
</svg>
